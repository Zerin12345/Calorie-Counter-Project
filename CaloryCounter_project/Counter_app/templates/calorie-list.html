{% extends "master/base.html" %}
{% block content %}
{% include 'master/message.html' %}
<h1>Calorie List</h1>
<table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">SL</th>
      <th scope="col">Item Name</th>
      <th scope="col">Consumed Calorie</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody> 
    {% for data in consumed_data %}
    <tr>
      <td>{{forloop.counter}}</td>
      <td>{{data.item_name}}</td>
      <td>{{data.calorie}}</td>
      <td>
        <a href="{% url 'edit_calorie' data.id %}"class="badge bg-primary">Edit</a>
        <a href="{% url 'delete_calorie' data.id %}"class="badge bg-primary">Delete</a>
      </td>
    </tr>
    {% endfor %}  
  </tbody>
</table>
<a href="{% url 'add_calorie' %}" class="btn btn-primary">Add Caloire </a>
{% endblock content %}
